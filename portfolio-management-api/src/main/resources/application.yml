spring:

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  application:
    name: portfolio-management-api

api:
   security:
     admin:
       username: ${API_ADMIN_USERNAME}
       password: ${API_ADMIN_PASSWORD}

   member:
     url: ${API_MEMBER_URL}

server:
  port: 8080